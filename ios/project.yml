name: CleanTube
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CleanTube:
    type: application
    platform: iOS
    sources:
      - path: CleanTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cleantube
        INFOPLIST_FILE: CleanTube/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  CleanTube:
    build:
      targets:
        CleanTube: all
    run:
      config: Debug
    archive:
      config: Release
